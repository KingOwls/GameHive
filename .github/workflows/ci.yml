name: GameHive checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  identity-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Official Deno release, fixed version/checksum; no ambient secrets needed.
      - name: Install verified Deno 2.9.8
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip -o "$RUNNER_TEMP/deno.zip"
          echo "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609  $RUNNER_TEMP/deno.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/deno"
      - name: Check all Edge entrypoints
        run: '"$RUNNER_TEMP/deno/deno" check --frozen supabase/functions/identity/index.ts supabase/functions/admin-identity/index.ts supabase/functions/catalog/index.ts supabase/functions/admin-games/index.ts supabase/functions/reviews/index.ts supabase/functions/review-votes/index.ts supabase/functions/library/index.ts supabase/functions/critic-applications/index.ts'
      - name: Start temporary local Supabase
        run: |
          # CLI emits credentials: keep its output private, including on failure.
          umask 077
          npx supabase start --exclude studio,storage-api,imgproxy,realtime,logflare,vector,supavisor > "$RUNNER_TEMP/gamehive-start.log" 2>&1
      - run: npm run test:sql
      - run: node scripts/test-catalog-concurrency.mjs
      - name: Actual catalog adapter with real local DB and controlled upstream
        run: GH_DENO_BIN="$RUNNER_TEMP/deno/deno" npm run test:catalog:db
      - run: npx playwright install --with-deps chromium
      - name: Real Auth, Data API and browser sessions
        run: npm run test:backend -- --e2e
      - name: Manual deadline, pool cancellation and concurrent authority/session changes
        run: GH_DENO_BIN="$RUNNER_TEMP/deno/deno" npm run test:manual:db
      - name: Real manual catalog, authorization, concurrency and public browser flow
        run: npm run test:manual -- --e2e
      - name: Review body limits and concurrent authority/session changes
        run: GH_DENO_BIN="$RUNNER_TEMP/deno/deno" npm run test:reviews:db
      - name: Reviews HTTP and browser with explicitly isolated catalog contract fixture
        run: GH_REVIEWS_ISOLATED=1 npm run test:reviews -- --e2e
      - name: Vote deadlines and concurrent authority/session changes
        run: GH_DENO_BIN="$RUNNER_TEMP/deno/deno" npm run test:votes:db
      - name: Irreversible votes HTTP and browser with explicitly isolated catalog fixture
        run: GH_REVIEWS_ISOLATED=1 npm run test:votes -- --e2e
      - name: Library deadlines and concurrent sessions/authority
        run: GH_DENO_BIN="$RUNNER_TEMP/deno/deno" npm run test:library:db
      - name: Library HTTP and browser with explicitly isolated persisted catalog fixture
        run: GH_REVIEWS_ISOLATED=1 npm run test:library -- --e2e
      - name: Applications deadlines, race and authority transactions
        run: GH_DENO_BIN="$RUNNER_TEMP/deno/deno" npm run test:applications:db
      - name: Private critic applications HTTP and browser
        run: npm run test:applications -- --e2e
      - name: Always stop temporary stack and remove private output
        if: always()
        run: |
          npx supabase stop > /dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/gamehive-start.log"
          rm -rf playwright-report test-results
      # No backend artifacts: Auth traces and credentials must never be uploaded.
